name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check . && mypy
      - run: pytest -q
      - run: python scripts/validate_skills.py
      - run: python evals/run.py
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t pmo-skills:test .
      - run: docker run --rm pmo-skills:test validate examples/project.json
      - run: docker run --rm pmo-skills:test report examples/project.json
