[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pmo-skills"
version = "0.1.0"
description = "Evidence-linked RAID review and consistent PMO status reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "opentelemetry-sdk>=1.30,<2"]

[project.optional-dependencies]
benchmark = ["openai>=2,<3"]
dev = ["openai>=2,<3", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "PyYAML>=6,<7", "types-PyYAML>=6,<7"]

[project.scripts]
pmo = "pmo_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmo_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pmo_skills"]

